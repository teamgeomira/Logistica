<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Malanga - Gestión Agrícola</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2d6a4f">
  <meta name="description" content="Sistema de gestión colaborativa para proyectos agrícolas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <style>
    /* ===== RESET Y VARIABLES ===== */
    :root {
      --primary: #2d6a4f;
      --primary-light: #40916c;
      --primary-dark: #1b4332;
      --primary-gradient: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #40916c 100%);
      --secondary: #52b788;
      --bg: #f0f4f0;
      --surface: #ffffff;
      --text: #1a1f1a;
      --text-secondary: #5a6a5a;
      --text-muted: #8a9a8a;
      --border: #e0e5e0;
      --danger: #c0392b;
      --danger-light: #fde8e5;
      --success: #27ae60;
      --success-light: #e5f5e9;
      --warning: #e67e22;
      --warning-light: #fef0e5;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
      --topbar-height: 60px;
      --nav-height: 62px;
      --sidebar-width: 260px;
      --max-content-width: 1200px;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
    .hidden { display: none !important; }
    .screen { min-height: 100vh; position: relative; }

    /* ===== ANIMACIONES ===== */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
    .animate-slide-up { animation: slideUp 0.5s ease forwards; }
    .animate-spin { animation: spin 0.7s linear infinite; }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ===== LOGIN ===== */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-gradient);
      padding: 1.5rem;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #login-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(255,255,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    #login-screen::after {
      content: '🌱';
      position: absolute;
      font-size: 6rem;
      opacity: 0.06;
      bottom: 10%;
      right: 5%;
      transform: rotate(20deg);
      pointer-events: none;
    }

    .login-box {
      background: var(--surface);
      padding: 2.75rem 2.25rem;
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .login-box .logo { text-align: center; margin-bottom: 1.75rem; }
    .login-box .logo-icon { font-size: 4rem; display: block; margin-bottom: 0.25rem; animation: bounce 2s ease-in-out infinite; }
    .login-box .logo-title { font-size: 2rem; font-weight: 800; color: var(--primary-dark); }
    .login-box .logo-title span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .login-box .logo-subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 1.75rem; font-size: 0.95rem; }

    .login-box .form-group { margin-bottom: 1.25rem; }
    .login-box .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem; }
    .login-box .form-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: border-color var(--transition);
    }
    .login-box .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(45,106,79,0.1);
    }

    .login-box .btn-login {
      width: 100%;
      padding: 0.9rem 1.5rem;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: transform var(--transition);
    }
    .login-box .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(45,106,79,0.35); }
    .login-box .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
    .login-box .btn-login .spinner { display: inline-block; width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,0.25); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 0.6rem; }

    .login-box .btn-link {
      background: none;
      border: none;
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 1rem;
      display: block;
      width: 100%;
      text-align: center;
      font-family: var(--font);
    }
    .login-box .btn-link:hover { color: var(--primary-dark); }

    .login-box .error-message {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 0.75rem;
      text-align: center;
      padding: 0.6rem 1rem;
      background: var(--danger-light);
      border-radius: var(--radius-sm);
      display: none;
      border-left: 4px solid var(--danger);
    }
    .login-box .error-message.visible { display: block; animation: fadeIn 0.3s ease; }

    .login-box .login-footer {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ===== TOPBAR ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--primary-gradient);
      color: #ffffff;
      padding: 0.5rem 1rem;
      height: var(--topbar-height);
      box-shadow: 0 2px 16px rgba(0,0,0,0.12);
    }

    .topbar .menu-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #ffffff;
      font-size: 1.5rem;
      padding: 0.4rem 0.7rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: none;
    }
    .topbar .menu-btn:hover { background: rgba(255,255,255,0.22); }

    .topbar .app-title {
      font-size: 1.15rem;
      flex: 1;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .topbar .app-title .title-text { background: linear-gradient(135deg, #ffffff, rgba(255,255,255,0.8)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .topbar-right { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }

    .topbar .connection-status {
      font-size: 1rem;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.12);
    }
    .topbar .connection-status.online { color: #7dffb3; background: rgba(125,255,179,0.15); }
    .topbar .connection-status.offline { color: #ffb3b3; background: rgba(255,179,179,0.15); animation: pulse 1.5s ease-in-out infinite; }
    .topbar .connection-status .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }

    .topbar .user-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255,255,255,0.1);
      padding: 0.2rem 0.8rem 0.2rem 0.3rem;
      border-radius: 24px;
      font-size: 0.85rem;
      max-width: 180px;
      overflow: hidden;
    }
    .topbar .user-badge .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .topbar .logout-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #ffffff;
      font-size: 1.2rem;
      padding: 0.4rem 0.7rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .topbar .logout-btn:hover { background: rgba(255,255,255,0.18); }

    /* ===== LAYOUT ===== */
    .app-layout {
      display: flex;
      min-height: calc(100vh - var(--topbar-height) - var(--nav-height));
      position: relative;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 0.75rem 0.5rem;
      position: sticky;
      top: var(--topbar-height);
      height: calc(100vh - var(--topbar-height));
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 50;
    }

    .sidebar .nav-section-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      padding: 0.75rem 0.75rem 0.3rem;
      font-weight: 700;
      opacity: 0.7;
    }

    .sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-radius: var(--radius-sm);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--font);
      transition: background var(--transition);
    }
    .sidebar .nav-item:hover { background: var(--bg); }
    .sidebar .nav-item.active { background: var(--primary); color: #ffffff; box-shadow: 0 2px 12px rgba(45,106,79,0.25); }
    .sidebar .nav-item .nav-icon { font-size: 1.2rem; flex-shrink: 0; width: 28px; text-align: center; }
    .sidebar .nav-item .nav-label { flex: 1; }

    .sidebar .nav-divider {
      height: 1px;
      background: var(--border);
      margin: 0.5rem 0.75rem;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      flex: 1;
      padding: 1.25rem 1.5rem;
      max-width: var(--max-content-width);
      margin: 0 auto;
      width: 100%;
      padding-bottom: calc(var(--nav-height) + 2.5rem);
      min-height: calc(100vh - var(--topbar-height));
      animation: fadeIn 0.3s ease;
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: none;
      z-index: 90;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
      color: var(--text-secondary);
      font-size: 0.6rem;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0.3rem 0.2rem;
      font-family: var(--font);
    }
    .bottom-nav .nav-btn .nav-icon { font-size: 1.5rem; }
    .bottom-nav .nav-btn .nav-label { font-weight: 600; font-size: 0.6rem; }
    .bottom-nav .nav-btn.active { color: var(--primary); background: var(--bg); }

    /* ===== FAB ===== */
    .fab {
      position: fixed;
      bottom: calc(var(--nav-height) + 1.25rem);
      right: 1.25rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: #ffffff;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(45,106,79,0.35);
      z-index: 80;
      border: none;
      cursor: pointer;
      transition: transform var(--transition);
    }
    .fab:hover { transform: scale(1.08); }
    .fab:active { transform: scale(0.92); }

    /* ===== DASHBOARD ===== */
    .dashboard .page-header { margin-bottom: 1.5rem; }
    .dashboard .page-title { font-size: 1.75rem; font-weight: 800; color: var(--primary-dark); }
    .dashboard .page-subtitle { color: var(--text-secondary); font-size: 0.95rem; }

    .dashboard .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .dashboard .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .dashboard .stat-card .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .dashboard .stat-card .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--primary-dark); margin-top: 0.15rem; }
    .dashboard .stat-card .stat-change { font-size: 0.7rem; margin-top: 0.25rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 12px; display: inline-block; }
    .dashboard .stat-card .stat-change.up { color: var(--success); background: var(--success-light); }
    .dashboard .stat-card .stat-change.down { color: var(--danger); background: var(--danger-light); }

    /* ===== ALERTAS ===== */
    .alerts-section, .recent-section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }
    .alerts-section .section-title, .recent-section .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .alert-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .alert-item:last-child { border-bottom: none; }
    .alert-item .alert-icon { font-size: 1.2rem; flex-shrink: 0; width: 28px; text-align: center; }
    .alert-item .alert-message { font-weight: 500; }
    .alert-item.alert-warning { color: var(--warning); border-left: 3px solid var(--warning); padding-left: 0.75rem; }
    .alert-item.alert-danger { color: var(--danger); border-left: 3px solid var(--danger); padding-left: 0.75rem; }
    .alert-item.alert-success { color: var(--success); border-left: 3px solid var(--success); padding-left: 0.75rem; }

    .recent-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.85rem;
    }
    .recent-item:last-child { border-bottom: none; }
    .recent-item .recent-text { font-weight: 500; }
    .recent-item .recent-time { font-size: 0.7rem; color: var(--text-muted); }

    /* ===== LISTAS ===== */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .section-header .section-title { font-size: 1.3rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; gap: 0.5rem; }

    .search-box { margin-bottom: 1rem; position: relative; }
    .search-box .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
    }
    .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: var(--shadow-focus); }

    .list-container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .list-header {
      display: flex;
      padding: 0.6rem 1rem;
      background: var(--bg-light);
      border-bottom: 2px solid var(--border);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .list-header .header-cell { flex: 1; padding: 0 0.25rem; }
    .list-header .header-cell:last-child { text-align: right; flex: 0 0 auto; min-width: 80px; }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-light);
      gap: 0.5rem;
    }
    .list-item:hover { background: var(--bg); }
    .list-item:last-child { border-bottom: none; }
    .list-item .list-main { display: flex; flex-wrap: wrap; gap: 0.4rem 0.8rem; flex: 1; align-items: center; }
    .list-item .item-text { font-weight: 500; font-size: 0.95rem; }
    .list-item .item-number { font-weight: 700; color: var(--primary-dark); font-size: 0.95rem; }
    .list-item .item-date { color: var(--text-secondary); font-size: 0.8rem; }
    .list-item .item-tag { font-size: 0.7rem; padding: 0.1rem 0.6rem; border-radius: 12px; font-weight: 600; background: var(--bg); color: var(--text-secondary); }
    .list-item .item-tag.success { background: var(--success-light); color: var(--success); }
    .list-item .item-tag.danger { background: var(--danger-light); color: var(--danger); }
    .list-item .item-tag.warning { background: var(--warning-light); color: var(--warning); }

    .list-item .list-actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
    .list-item .list-actions .btn-icon {
      background: none;
      border: none;
      font-size: 1rem;
      padding: 0.3rem 0.5rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-secondary);
    }
    .list-item .list-actions .btn-icon:hover { background: var(--bg); }
    .list-item .list-actions .btn-icon.danger:hover { background: var(--danger-light); color: var(--danger); }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-secondary);
    }
    .empty-state .empty-icon { font-size: 4rem; display: block; margin-bottom: 0.75rem; opacity: 0.6; }
    .empty-state .empty-title { font-weight: 700; font-size: 1.2rem; color: var(--text); }

    /* ===== SUBNAV ===== */
    .subnav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: var(--surface);
      padding: 0.75rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .chip {
      background: var(--bg);
      color: var(--text-secondary);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      font-family: var(--font);
    }
    .chip:hover { background: var(--accent); color: var(--primary-dark); }
    .chip.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    /* ===== MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.25s ease;
      backdrop-filter: blur(4px);
    }
    .modal .modal-content {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border);
    }
    .modal .modal-header .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; gap: 0.5rem; }
    .modal .modal-header .modal-close {
      background: none;
      border: none;
      font-size: 1.8rem;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .modal .modal-header .modal-close:hover { color: var(--text); }

    /* ===== FORMULARIOS ===== */
    .field-group {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 1rem 1rem 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border-light);
    }
    .field-group .field-group-title { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.3rem; }
    .form-group label .required { color: var(--danger); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--surface);
      color: var(--text);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--shadow-focus);
    }
    .form-group textarea { min-height: 80px; resize: vertical; }

    .form-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 2px solid var(--border);
      flex-wrap: wrap;
    }

    /* ===== BOTONES ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      font-family: var(--font);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      min-height: 44px;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

    .btn-primary { background: var(--primary-gradient); color: #ffffff; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(45,106,79,0.3); }

    .btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--border); }

    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-dark); }

    .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; min-height: 32px; }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: calc(var(--nav-height) + 1.5rem);
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      width: 90%;
      max-width: 440px;
      pointer-events: none;
    }
    .toast {
      background: var(--primary-dark);
      color: #ffffff;
      padding: 0.8rem 1.2rem;
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      font-size: 0.9rem;
      text-align: center;
      pointer-events: auto;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.warning { background: var(--warning); }

    /* ===== CONFIGURACIÓN ===== */
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .config-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .config-card .config-card-title { font-size: 0.9rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .config-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }

    /* ===== UPLOAD ===== */
    .upload-box { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .upload-box .file-input-wrapper { flex: 1; min-width: 200px; }
    .upload-box .file-input-wrapper input[type="file"] {
      width: 100%;
      padding: 0.6rem;
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
    }

    /* ===== QUICK MENU ===== */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.5rem;
    }
    .quick-item {
      padding: 0.75rem 0.5rem;
      text-align: center;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }
    .quick-item .qi-icon { font-size: 1.5rem; }
    .quick-item:hover { background: var(--accent); border-color: var(--primary); transform: translateY(-3px); }

    /* ===== SIDEBAR OVERLAY ===== */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 55;
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .sidebar-overlay.visible { display: block; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 767px) {
      .topbar .menu-btn { display: block; }
      .topbar .user-badge .avatar-text { display: none; }
      .topbar .user-badge { padding: 0.2rem 0.3rem; max-width: 40px; background: transparent; border: none; }

      .sidebar {
        position: fixed;
        top: var(--topbar-height);
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        width: 280px;
        box-shadow: 0 4px 30px rgba(0,0,0,0.15);
        z-index: 60;
        transition: transform var(--transition);
        border-radius: 0 12px 12px 0;
      }
      .sidebar.open { transform: translateX(0); }

      .bottom-nav { display: flex; }

      .dashboard .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
      .dashboard .stat-card { padding: 0.75rem; }
      .dashboard .stat-card .stat-value { font-size: 1.2rem; }

      .main-content { padding: 0.75rem; padding-bottom: calc(var(--nav-height) + 1.5rem); }

      .modal .modal-content { max-width: 100%; margin: 0.5rem; padding: 1rem; }

      .list-item { flex-wrap: wrap; padding: 0.6rem 0.75rem; }
      .list-item .list-actions { width: 100%; justify-content: flex-end; padding-top: 0.25rem; border-top: 1px solid var(--border-light); }
      .list-header { display: none; }

      .login-box { padding: 1.75rem 1.25rem; margin: 0.5rem; }
      .login-box .logo-title { font-size: 1.5rem; }
      .login-box .logo-icon { font-size: 3rem; }

      .fab { width: 52px; height: 52px; font-size: 1.8rem; bottom: calc(var(--nav-height) + 0.75rem); right: 0.75rem; }

      .config-grid { grid-template-columns: 1fr; }
      .subnav { padding: 0.5rem; gap: 0.3rem; }
      .chip { font-size: 0.7rem; padding: 0.3rem 0.6rem; }

      .form-actions { flex-direction: column-reverse; }
      .form-actions .btn { width: 100%; justify-content: center; }
    }

    @media (min-width: 768px) {
      .bottom-nav { display: none; }
      .topbar .menu-btn { display: none; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141914;
        --bg-light: #1a201a;
        --surface: #1f251f;
        --text: #e8ede8;
        --text-secondary: #9aad9a;
        --text-muted: #6a7d6a;
        --border: #2a322a;
        --border-light: #242c24;
        --accent: #1a3328;
        --shadow-focus: 0 0 0 3px rgba(45,106,79,0.15);
      }
      .login-box { background: var(--surface); }
      .login-box .form-group input { background: var(--bg); color: var(--text); border-color: var(--border); }
      .dashboard .stat-card { background: var(--surface); border-color: var(--border); }
      .dashboard .stat-card .stat-value { color: var(--text); }
      .list-container { background: var(--surface); border-color: var(--border); }
      .sidebar { background: var(--surface); border-color: var(--border); }
      .bottom-nav { background: var(--surface); border-color: var(--border); }
      .config-card { background: var(--surface); border-color: var(--border); }
      .modal .modal-content { background: var(--surface); border-color: var(--border); }
      .field-group { background: var(--bg); border-color: var(--border); }
      .chip { background: var(--bg); color: var(--text-secondary); }
      .chip.active { background: var(--primary); color: #ffffff; }
      .search-box input { background: var(--bg); color: var(--text); border-color: var(--border); }
      .form-group input, .form-group select, .form-group textarea { background: var(--bg); color: var(--text); border-color: var(--border); }
      .toast { background: var(--surface); color: var(--text); }
      .toast.success { background: var(--success-dark); color: #ffffff; }
      .toast.error { background: var(--danger-dark); color: #ffffff; }
      .toast.warning { background: var(--warning-dark); color: #ffffff; }
      .alert-item.alert-warning { border-left-color: var(--warning); color: var(--warning); }
      .alert-item.alert-danger { border-left-color: var(--danger); color: var(--danger); }
      .list-item .item-number { color: var(--secondary); }
      .dashboard .stat-card .stat-change.up { background: var(--success-light); }
      .dashboard .stat-card .stat-change.down { background: var(--danger-light); }
    }

    @media print {
      .topbar, .sidebar, .bottom-nav, .fab, .toast-container, .modal { display: none !important; }
      .main-content { padding: 0 !important; }
      .dashboard .stat-card { box-shadow: none !important; border: 1px solid #ddd !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .login-box, .modal .modal-content, .toast { animation: none !important; }
    }
  </style>
</head>
<body>
  <!-- ===== LOGIN ===== -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <div class="logo">
        <span class="logo-icon">🌱</span>
        <div class="logo-title"><span>Malanga</span></div>
      </div>
      <p class="logo-subtitle">Gestión colaborativa del proyecto agrícola</p>

      <form id="login-form" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="login-email">📧 Correo electrónico</label>
          <input type="email" id="login-email" placeholder="socio@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">🔐 Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" minlength="6">
        </div>
        <button type="submit" id="login-btn" class="btn btn-login">
          <span id="login-btn-content">🚀 Entrar</span>
        </button>
      </form>

      <button id="reset-password" class="btn-link">¿Olvidaste tu contraseña?</button>
      <div id="login-error" class="error-message" role="alert"></div>

      <div class="login-footer">
        <span class="version">v2.1.0</span>
        <span>·</span>
        <span>© 2026 Malanga</span>
      </div>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div id="app-screen" class="screen hidden">
    <!-- TOPBAR -->
    <header class="topbar" role="banner">
      <button id="menu-toggle" class="menu-btn" aria-label="Abrir menú">☰</button>
      <div class="app-title">
        <span class="emoji">🌱</span>
        <span class="title-text">Malanga</span>
      </div>
      <div class="topbar-right">
        <span id="connection-status" class="connection-status online" title="Conectado" role="status">
          <span class="status-dot"></span>
        </span>
        <div class="user-badge" id="user-badge">
          <span class="avatar" id="user-avatar">👤</span>
          <span class="avatar-text" id="user-name">Usuario</span>
        </div>
        <button id="logout-btn" class="logout-btn" title="Cerrar sesión">⏻</button>
      </div>
    </header>

    <!-- LAYOUT -->
    <div class="app-layout">
      <aside id="sidebar" class="sidebar" role="navigation"></aside>
      <main id="main-content" class="main-content" role="main"></main>
    </div>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav" class="bottom-nav" role="navigation"></nav>

    <!-- FAB -->
    <button id="fab" class="fab" aria-label="Acciones rápidas">+</button>
  </div>

  <!-- ===== MODALES ===== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="quick-menu" class="modal hidden" role="dialog" aria-modal="true"></div>

  <!-- ===== TOAST ===== -->
  <div class="toast-container" aria-live="polite" aria-atomic="true">
    <div id="toast" class="toast hidden" role="alert"></div>
  </div>

  <!-- ===== SCRIPTS - TODOS EN app.js (UNIFICADO) ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-database-compat.js"></script>

  <!-- UN SOLO ARCHIVO CON TODO -->
  <script src="./js/app.js?v=3"></script>

  <!-- SERVICE WORKER -->
  <script>
    (function() {
      console.log('🌱 Malanga v2.1.0');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
          .then(function(reg) { console.log('✅ Service Worker registrado:', reg.scope); })
          .catch(function(err) { console.warn('⚠️ Service Worker:', err); });
      }
    })();
  </script>
</body>
</html>
