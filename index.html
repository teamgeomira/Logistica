<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AgroGest - Malanga</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <!-- Pantalla de autenticación -->
        <section id="auth-screen" class="auth-screen hidden">
            <div class="auth-container">
                <h1>🌱 AgroGest</h1>
                <h2>Proyecto Malanga</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                </form>
                <button id="btn-reset-password" class="btn btn-link">¿Olvidaste tu contraseña?</button>
                <p id="auth-error" class="error-text"></p>
            </div>
        </section>

        <!-- Interfaz principal -->
        <section id="main-app" class="main-app hidden">
            <!-- Sidebar escritorio -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h1>🌱 AgroGest</h1>
                    <p>Cultivo de Malanga</p>
                </div>
                <nav id="sidebar-nav" class="sidebar-nav"></nav>
                <div class="sidebar-footer">
                    <button id="btn-logout-sidebar" class="btn btn-outline btn-block">Cerrar sesión</button>
                </div>
            </aside>

            <!-- Contenido principal -->
            <div class="content">
                <header class="topbar">
                    <button id="btn-menu-toggle" class="icon-btn">☰</button>
                    <h2 id="section-title">Inicio</h2>
                    <div class="topbar-right">
                        <span id="connection-indicator" class="badge badge-success">🟢 Conectado</span>
                        <button id="btn-quick-add" class="btn btn-primary">+</button>
                    </div>
                </header>
                <main id="main-content" class="main-content"></main>
            </div>

            <!-- Navegación inferior móvil -->
            <nav id="bottom-nav" class="bottom-nav"></nav>
        </section>

        <!-- Modal genérico -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modal-title">Modal</h3>
                    <button id="modal-close" class="icon-btn">×</button>
                </div>
                <div id="modal-body" class="modal-body"></div>
                <div class="modal-footer">
                    <button id="modal-cancel" class="btn btn-outline">Cancelar</button>
                    <button id="modal-confirm" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
