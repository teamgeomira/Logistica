<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malanga - Gestión Agrícola</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2d6a4f">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de login -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>🌱 Malanga</h1>
      <p class="login-subtitle">Gestión colaborativa del proyecto agrícola</p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="socio@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="button" id="login-btn" class="btn-primary btn-block">Entrar</button>
      </form>
      <button id="reset-password" class="btn-link">¿Olvidaste tu contraseña?</button>
      <div id="login-error" class="error-message"></div>
    </div>
  </div>

  <!-- Pantalla principal -->
  <div id="app-screen" class="screen hidden">
    <header class="topbar">
      <button id="menu-toggle" class="btn-icon" aria-label="Menú">☰</button>
      <h1 id="app-title">🌱 Malanga</h1>
      <div class="topbar-right">
        <span id="connection-status" class="connection-status">🟢</span>
        <button id="logout-btn" class="btn-icon" title="Cerrar sesión">⏻</button>
      </div>
    </header>

    <div class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="main-content" class="main-content"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="Acciones rápidas">+</button>
  </div>

  <!-- Modal genérico -->
  <div id="modal" class="modal hidden"></div>

  <!-- Menú rápido -->
  <div id="quick-menu" class="modal hidden"></div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Firebase compat (global) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-database-compat.js"></script>

  <!-- Scripts de la aplicación en orden -->
  <script src="./js/config.js"></script>
  <script src="./js/firebase.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/database.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
